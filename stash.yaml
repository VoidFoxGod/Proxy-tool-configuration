  # 预解析：用于 bootstrap 启动以及解析本地/远程加密 DNS (DoH/DoT) 本身域名的基础服务器
  default-nameserver:
    - 223.5.5.5
    - 52.80.66.66
    - 2400:3200::1
    - 2400:7fc0:849e:200::4
    - system
    
  # 国内解析：专用于直连流量与中国大陆域名的低延迟加密查询 (DoH)
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.onedns.net/dns-query
      
  # 海外解析：专用于代理/海外域名的无污染全加密安全查询 (DoH)
  fallback:
    - https://dns.google/dns-query
    - https://doh.opendns.com/dns-query
      
  # 拦截与重定向机制：防止国内 DNS 污染的核心屏障
  fallback-filter:
    geoip: true
    geoip-code: CN            # 过滤逻辑：若 nameserver 解析回来的 IP 不在中国大陆，则强制抛弃，改用 fallback 解析结果
    ipcidr:                   # 过滤境外 DNS 常见的假 IP 污染段
