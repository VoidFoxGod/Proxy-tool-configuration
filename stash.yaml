      - '+.googlevideo.com'

profile                           :                   # 其他首选项
  tracing                         : true              # 启用数据跟踪面板
  store-selected                  : true              # 储存 API 对策略组的选择，以供下次启动时使用
  store-fake-ip                   : true              # 储存 fakeip 映射表，域名再次发生连接时，使用原有映射地址

proxy-providers:
  fq:
    type: http
    url: "http://sub.store/download/collection/fq?target=Stash"     # 👈 替换为您代理海外的主翻墙订阅链接
    interval: 86400
    path: ./providers/fq.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 600

  fq-ml:
    type: http
    url: "http://sub.store/download/collection/cloudmusic?target=Stash"  # 👈 替换为您的国外免流/特定订阅链接
    interval: 86400
    path: ./providers/fq_ml.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 600

  cn-ml:
    type: http
    url: "http://sub.store/download/collection/cloudmusic-cn?target=Stash"  # 👈 替换为您的国内免流/回国特定订阅链接
    interval: 86400
    path: ./providers/cn_ml.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 600

rule-providers:
  proxy:
    type: http
    behavior: domain          # 使用 domain 类规则集，可以使匹配更高效
    format: text              # 使用 text 格式的规则集
    url: "https://github.com/QuixoticHeart/rule-set/raw/refs/heads/ruleset/stash/proxy.list"
    interval: 86400

  adrules:
    type: http
    behavior: domain
    format: text
    url: "https://github.com/QuixoticHeart/rule-set/raw/refs/heads/ruleset/stash/domain/adrules.list"
    interval: 86400

  cn:
    type: http
    behavior: domain
    format: text
    url: "https://github.com/QuixoticHeart/rule-set/raw/refs/heads/ruleset/stash/cn.list"
    interval: 86400

  cncidr:
    type: http
    behavior: ipcidr            # 纯 IP 路由网段匹配算法
    format: text
    url: "https://github.com/QuixoticHeart/rule-set/raw/refs/heads/ruleset/stash/cncidr.list"
    interval: 86400

  private:
    type: http
    behavior: domain
    format: text
    url: "https://github.com/QuixoticHeart/rule-set/raw/refs/heads/ruleset/stash/private.list"
    interval: 86400

proxy-groups:
  # 海外主控代理策略组 (挂载 fq 节点源，嵌套子策略 fq ml)
  - name: Proxy
    type: select
    proxies:
      - DIRECT
      - fq ml
    use:
      - fq

  # 国外特定免流策略组 (挂载 fq-ml 节点源)
  - name: fq ml
    type: select
    proxies:
      - DIRECT
    use:
      - fq-ml

  # 大陆本地流量路由控制组 (控制国内流量直连或内网免流切换)
  - name: ChinaRouter
    type: select
    proxies:
      - DIRECT
      - cn ml
  
  # 国内特定免流策略组 (挂载 cn-ml 节点源)
  - name: cn ml
    type: select
    proxies:
      - DIRECT
    use:
      - cn-ml

rules:
  - DOMAIN,dns.alidns.com,DIRECT
  - DOMAIN,doh.onedns.net,DIRECT
  - DOMAIN,dns.google,Proxy
  - DOMAIN,doh.opendns.com,Proxy

  - PROTOCOL,QUIC,REJECT                       # 拦截所有基于 UDP 的 QUIC 协议 (强迫客户端降级到 TCP 走代理，防止某些 ISP 严重阻断 UDP)
  - PROTOCOL,STUN,REJECT                       # 拦截 WebRTC 穿透嗅探协议 (防止因 NAT 探测导致浏览器在代理状态下意外泄露国内真实物理 IP)

  - RULE-SET,private,DIRECT                    # 内网、局域网及私有服务控制
  - RULE-SET,adrules,REJECT                    # 广告、追踪及隐私窃取流量净化
  - RULE-SET,proxy,Proxy                       # 国际通用代理与被墙网站分流控制
  - RULE-SET,cn,ChinaRouter                    # 大陆本土域名与直连列表分流控制
  - RULE-SET,cncidr,ChinaRouter,no-resolve     # 大陆本土物理 IP 路由段分流控制,添加 no-resolve 以避免触发 DNS 解析。
  
  - GEOIP,CN,ChinaRouter                       # 地理位置防线 (真实 IP 模式的终极护盾)，未被上述云端规则捕获的残留大陆本地流量，通过内核解析物理 IP 并进行底层地理位置匹配，强制并入 ChinaRouter 组
  
  - MATCH,Proxy                                # 全局漏网之鱼：对未命中任何规则的边缘流量进行安全兜底
