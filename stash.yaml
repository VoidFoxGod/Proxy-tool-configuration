  # 引导 DNS（Bootstrap）：
  # 仅用于解析下方 DoH 服务器域名，例如 dns.alidns.com、dns.google。
  # 这里保留原配置中的 IPv4、IPv6 地址，不参与国内外网站的最终分流判断。
  default-nameserver:
    - 223.5.5.5
    - 52.80.66.66
    - 2400:3200::1
    - 2400:7fc0:849e:200::4

  # 默认/国内 DNS：保留原来的阿里 DoH 与 OneDNS DoH。
  # 未命中 nameserver-policy 的域名，默认先由这一组解析。
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.onedns.net/dns-query

  # 按域名类别指定 DNS：
  # 这里只决定“由哪组 DNS 解析”，不会替代 rules 中的 RULE-SET。
  # 你的 proxy-domain、cn-domain、proxy-ip、cn-ip 等规则集仍负责决定流量走 Proxy、ChinaRouter 或 DIRECT。
  nameserver-policy:
    # 中国大陆域名使用原来的阿里 DoH、OneDNS DoH。
    'geosite:cn':
      - https://dns.alidns.com/dns-query
      - https://doh.onedns.net/dns-query

    # 非中国大陆域名使用原来的 Google DoH、OpenDNS DoH。
    'geosite:geolocation-!cn':
      - https://dns.google/dns-query
      - https://doh.opendns.com/dns-query

profile                           :                   # 其他首选项
  tracing                         : false             # 暂时关闭数据跟踪面板，降低 Network Extension 内存占用
  store-selected                  : true              # 储存 API 对策略组的选择，以供下次启动时使用
  store-fake-ip                   : true              # 储存 fakeip 映射表，域名再次发生连接时，使用原有映射地址

proxy-providers:
  fq:
    type: http
    url: "http://sub.store/download/collection/fq?target=Stash"     # 👈 替换为您代理海外的主翻墙订阅链接
    interval: 86400
    path: ./providers/fq.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 600

  fq-ml:
    type: http
    url: "http://sub.store/download/collection/cloudmusic?target=Stash"  # 👈 替换为您的国外免流/特定订阅链接
    interval: 86400
    path: ./providers/fq_ml.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 600

  cn-ml:
    type: http
    url: "http://sub.store/download/collection/cloudmusic-cn?target=Stash"  # 👈 替换为您的国内免流/回国特定订阅链接
    interval: 86400
    path: ./providers/cn_ml.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 600

rule-providers:
  # 国际通用代理与被墙网站：域名规则集
  proxy-domain:
    type: http
    behavior: domain          # 使用 domain 类规则集，可以使域名匹配更高效
    format: text              # 使用 text 格式的规则集
    url: "https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/stash/domain/proxy.list"
    interval: 86400           # 每 24 小时自动更新一次规则集

  # 国际通用代理与被墙网站：IPv4 / IPv6 路由网段规则集
  proxy-ip:
    type: http
    behavior: ipcidr          # 使用 ipcidr 类规则集，适用于纯 IP 路由网段匹配
    format: text              # 使用 text 格式的规则集
    url: "https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/stash/ipcidr/proxy.list"
    interval: 86400           # 每 24 小时自动更新一次规则集

  # 广告、追踪及隐私窃取流量：域名规则集
  adrules-domain:
    type: http
    behavior: domain          # 使用 domain 类规则集，可以使域名匹配更高效
    format: text              # 使用 text 格式的规则集
    url: "https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/stash/domain/adrules.list"
    interval: 86400           # 每 24 小时自动更新一次规则集

  # 广告、追踪及隐私窃取流量：IPv4 / IPv6 路由网段规则集
  adrules-ip:
    type: http
    behavior: ipcidr          # 使用 ipcidr 类规则集，适用于纯 IP 路由网段匹配
    format: text              # 使用 text 格式的规则集
    url: "https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/stash/ipcidr/adrules.list"
    interval: 86400           # 每 24 小时自动更新一次规则集

  # 大陆本土域名与直连列表：域名规则集
  cn-domain:
    type: http
    behavior: domain          # 使用 domain 类规则集，可以使域名匹配更高效
    format: text              # 使用 text 格式的规则集
    url: "https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/stash/domain/cn.list"
    interval: 86400           # 每 24 小时自动更新一次规则集

  # 大陆本土物理 IP 路由段：IPv4 / IPv6 路由网段规则集
  cn-ip:
    type: http
    behavior: ipcidr          # 纯 IP 路由网段匹配算法
    format: text              # 使用 text 格式的规则集
    url: "https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/stash/ipcidr/cn.list"
    interval: 86400           # 每 24 小时自动更新一次规则集

  # 内网、局域网及私有服务：域名规则集
  private-domain:
    type: http
    behavior: domain          # 使用 domain 类规则集，可以使域名匹配更高效
    format: text              # 使用 text 格式的规则集
    url: "https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/stash/domain/private.list"
    interval: 86400           # 每 24 小时自动更新一次规则集

  # 内网、局域网及私有服务：IPv4 / IPv6 私有网段规则集
  private-ip:
    type: http
    behavior: ipcidr          # 使用 ipcidr 类规则集，适用于纯 IP 路由网段匹配
    format: text              # 使用 text 格式的规则集
    url: "https://raw.githubusercontent.com/QuixoticHeart/rule-set/refs/heads/ruleset/stash/ipcidr/private.list"
    interval: 86400           # 每 24 小时自动更新一次规则集

proxy-groups:
  # 海外主控代理策略组 (挂载 fq 节点源，嵌套子策略 fq ml)
  - name: Proxy
    type: select
    proxies:
      - DIRECT
      - fq ml
    use:
      - fq

  # 国外特定免流策略组 (挂载 fq-ml 节点源)
  - name: fq ml
    type: select
    proxies:
      - DIRECT
    use:
      - fq-ml

  # 大陆本地流量路由控制组 (控制国内流量直连或内网免流切换)
  - name: ChinaRouter
    type: select
    proxies:
      - DIRECT
      - cn ml
  
  # 国内特定免流策略组 (挂载 cn-ml 节点源)
  - name: cn ml
    type: select
    proxies:
      - DIRECT
    use:
      - cn-ml

rules:
  - PROTOCOL,QUIC,REJECT                         # 拦截所有基于 UDP 的 QUIC 协议（强迫客户端降级到 TCP 走代理，防止某些 ISP 严重阻断 UDP）
  - PROTOCOL,STUN,REJECT                         # 拦截 WebRTC 穿透嗅探协议（防止因 NAT 探测导致浏览器在代理状态下意外泄露国内真实物理 IP）

  # 内网、局域网及私有服务控制
  - RULE-SET,private-domain,DIRECT               # 内网、局域网及私有服务域名直接连接
  - RULE-SET,private-ip,DIRECT,no-resolve         # 内网及私有 IP 网段直接连接，添加 no-resolve 以避免触发 DNS 解析

  # 广告、追踪及隐私窃取流量净化
  - RULE-SET,adrules-domain,REJECT               # 拦截广告及追踪域名
  - RULE-SET,adrules-ip,REJECT,no-resolve         # 拦截广告及追踪 IP 网段，添加 no-resolve 以避免触发 DNS 解析

  # 国际通用代理与被墙网站分流控制
  - RULE-SET,proxy-domain,Proxy                  # 国际通用代理与被墙网站域名分流控制
  - RULE-SET,proxy-ip,Proxy,no-resolve            # 国际通用代理与被墙网站 IP 网段分流控制，添加 no-resolve 以避免触发 DNS 解析

  # 大陆本土域名与物理 IP 路由段分流控制
  - RULE-SET,cn-domain,ChinaRouter               # 大陆本土域名与直连列表分流控制
  - RULE-SET,cn-ip,ChinaRouter,no-resolve         # 大陆本土物理 IP 路由段分流控制，添加 no-resolve 以避免触发 DNS 解析

  - GEOIP,CN,ChinaRouter                         # 地理位置防线（真实 IP 模式的终极护盾）：未被上述云端规则捕获的残留大陆本地流量，通过内核解析物理 IP 并进行底层地理位置匹配，强制并入 ChinaRouter 组

  - MATCH,Proxy                                  # 全局漏网之鱼：对未命中任何规则的边缘流量进行安全兜底
