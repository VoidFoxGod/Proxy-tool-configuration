mixed-port: 7890             # 混合代理端口 (HTTP/SOCKS5 共用)
allow-lan: true              # 允许局域网设备连接
mode: rule                   # 运行模式：规则分流 (Rule)
log-level: info              # 日志输出级别
ipv6: true                   # 全局开启 IPv6 流量接管与路由
external-controller: '0.0.0.0:9090' # 外部控制 API 端口

geodata-mode                      : false                                               # 更改 geoip 文件类型 （true为 dat，此项有默认值 false为mmdb）
geodata-loader                    : memconservative                                     # GEO 文件加载模式 :  standard：标准加载器  \  memconservative：专为内存受限 (小内存) 设备优化的加载器 (默认值)
geo-auto-update                   : true                                                # 自动更新GeoIP数据库
geo-update-interval               : 24                                                  # 更新GeoIP数据库的 时间间隔（小时）
geox-url                          :                                                     # 更新GeoIP数据库的 链接
  geoip                           : 'https://raw.githubusercontent.com/Loyalsoldier/geoip/release/geoip.dat'
  geosite                         : 'https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat'
  mmdb                            : 'https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-Country.mmdb'
  asn                             : 'https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN.mmdb'

ntp:
  enable: true                                                # 是否同步至系统时间
  write-to-system: false     
  server: 'time.apple.com'         
  benchmark-url: 'https://www.apple.com/library/test/success.html'
  benchmark-timeout: 5 
  port: 123 

tun:                                                         # 配置：TUN 核心层接管，彻底杜绝 WebRTC 和全局流量泄露
  enable: true 
  auto-detect-interface: true                                # 自动检测出口网卡
  auto-route: true 
  stack: system                                              # 配置TUN使用系统级核心
  dns-hijack: [ 'any:53' ]                                   # 强制将本地所有 53 端口 DNS 请求劫持给 Stash 内置 DNS 处理

dns:
  enable: true
  listen: 0.0.0.0:53            # 本地 DNS 服务监听端口
  ipv6: true                    # 开启 DNS AAAA 记录解析

  #follow-rule: false           # DNS 查询不跟随 rules/策略组；所有上游 DNS 均由当前网络直接连接
  #use-hosts: true              # 查询 hosts 并返回 IP 记录
  #skip-cert-verify: false      # TLS 握手时是否忽略证书验证    （ 如果设置为 true ，即，跳过证书验证，用来解决部分兼容性问题 ）

  enhanced-mode: fake-ip        # 核心技术：Fake-IP 模式 (本地直接返回虚假 IP，海外域名通过代理隧道加密至远端解析，底层杜绝 DNS 泄露)
  fake-ip-range: 198.18.0.1/16  # 虚假本地 IP 分配池

  # 虚假 IP 过滤器：强制指定域名跳过 Fake-IP 分配，直接返回真实物理 IP
