  # 引导 DNS（Bootstrap）：
  # 仅用于解析下方 DoH 服务器域名，例如 dns.alidns.com、dns.google。
  # 这里保留原配置中的 IPv4、IPv6 地址，不参与国内外网站的最终分流判断。
  default-nameserver:
    - 223.5.5.5
    - 52.80.66.66
    - 2400:3200::1
    - 2400:7fc0:849e:200::4

  # 默认/国内 DNS：保留原来的阿里 DoH 与 OneDNS DoH。
  # 未命中 nameserver-policy 的域名，默认先由这一组解析。
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.onedns.net/dns-query

  # 按域名类别指定 DNS：
  # 这里只决定“由哪组 DNS 解析”；实际流量由下方 GEOSITE / GEOIP 规则决定走 Proxy、ChinaRouter 或 DIRECT。
  nameserver-policy:
    # 中国大陆域名使用原来的阿里 DoH、OneDNS DoH。
    'geosite:cn':
      - https://dns.alidns.com/dns-query
      - https://doh.onedns.net/dns-query

    # 非中国大陆域名使用原来的 Google DoH、Quad9 DoH。
    'geosite:geolocation-!cn':
      - https://dns.google/dns-query
      - https://dns.quad9.net/dns-query

proxy-providers:
  provider-fq:
    url: "http://sub.store/download/collection/fq?target=Stash"     # 👈 替换为您代理海外的主翻墙订阅链接
    interval: 86400
    path: ./providers/fq.yaml
    benchmark-url: http://www.gstatic.com/generate_204
    benchmark-timeout: 5

  provider-fq-ml:
    url: "http://sub.store/download/collection/cloudmusic?target=Stash"  # 👈 替换为您的国外免流/特定订阅链接
    interval: 86400
    path: ./providers/fq_ml.yaml
    benchmark-url: http://www.gstatic.com/generate_204
    benchmark-timeout: 5

  provider-cn-ml:
    url: "http://sub.store/download/collection/cloudmusic-cn?target=Stash"  # 👈 替换为您的国内免流/回国特定订阅链接
    interval: 86400
    path: ./providers/cn_ml.yaml
    benchmark-url: http://www.gstatic.com/generate_204
    benchmark-timeout: 5


proxy-groups:
  # 海外主控代理策略组 (嵌套子策略 fq，fq ml)
  - name: Proxy
    type: select
    proxies:
      - DIRECT
      - fq
      - fq ml

  # 国外特定翻墙策略组（挂载 fq 节点源）
  - name: fq
    type: select
    proxies:
      - DIRECT
    use:
      - provider-fq

  # 国外特定免流策略组 (挂载 fq-ml 节点源)
  - name: fq ml
    type: select
    proxies:
      - DIRECT
    use:
      - provider-fq-ml

  # 大陆本地流量路由控制组 (控制国内流量直连或内网免流切换)
  - name: ChinaRouter
    type: select
    proxies:
      - DIRECT
      - cn ml
  
  # 国内特定免流策略组 (挂载 cn-ml 节点源)
  - name: cn ml
    type: select
    proxies:
      - DIRECT
    use:
      - provider-cn-ml

rules:
  # DNS 上游连接分流
  - DOMAIN,dns.alidns.com,DIRECT                 # 阿里 DoH 直接连接
  - DOMAIN,doh.onedns.net,DIRECT                 # OneDNS DoH 直接连接
  - DOMAIN,dns.google,Proxy                      # Google DoH 通过海外代理连接
  - DOMAIN,dns.quad9.net,Proxy                 # OpenDNS DoH 通过海外代理连接
  
  # 协议拦截
  - PROTOCOL,QUIC,REJECT                         # 拦截 QUIC，通常促使支持回退的应用改用 TCP/TLS
  - PROTOCOL,STUN,REJECT                         # 拦截 STUN，降低 WebRTC 暴露真实出口 IP 的风险

  # 内网与局域网：优先直连
  - GEOSITE,private,DIRECT                       # 私有域名、本地域名直接连接
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve       # IPv4 回环地址
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve        # IPv4 私有地址
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve     # IPv4 私有地址
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve    # IPv4 私有地址
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve    # IPv4 链路本地地址
  - IP-CIDR6,::1/128,DIRECT,no-resolve           # IPv6 回环地址
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve          # IPv6 唯一本地地址
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve         # IPv6 链路本地地址

  # 广告与追踪域名
  - GEOSITE,category-ads-all,REJECT              # 拦截 domain-list-community 中的广告域名

  # 中国大陆流量
  - GEOSITE,cn,ChinaRouter                       # 中国大陆域名交给 ChinaRouter
  - GEOIP,CN,ChinaRouter,no-resolve              # 中国大陆 IP 交给 ChinaRouter

  # 非中国大陆域名
  - GEOSITE,geolocation-!cn,Proxy                # 非中国大陆域名交给 Proxy

  # 兜底
  - MATCH,Proxy                                  # 其余未命中流量默认走 Proxy
